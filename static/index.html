<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClearRead</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f5f7; color: #1a2233; margin: 0; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px; }
  h1 { margin: 0 0 4px; }
  .sub { color: #5b6577; margin: 0 0 24px; }
  #drop { border: 2px dashed #9aa4b5; border-radius: 12px; background: #fff; padding: 48px 16px;
          text-align: center; cursor: pointer; color: #5b6577; }
  #drop.over { border-color: #2563eb; background: #eef4ff; }
  #card { background: #fff; border-radius: 12px; padding: 20px; margin-top: 24px; display: none;
          box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .name { font-weight: 600; word-break: break-all; }
  .badge { color: #fff; padding: 4px 12px; border-radius: 999px; font-size: 14px; white-space: nowrap; }
  .clean { background: #15803d; }
  .found { background: #b91c1c; }
  ul { list-style: none; padding: 0; margin: 16px 0 0; }
  li { border-top: 1px solid #e3e6ec; padding: 12px 0; }
  .text { white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; background: #fef2f2; padding: 6px 8px;
          border-radius: 6px; word-break: break-word; }
  .meta { color: #5b6577; font-size: 14px; margin-top: 6px; }
  .error { color: #b91c1c; }
  .ok { color: #15803d; }
  #cleanbar { margin-top: 16px; display: none; }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  button { background: #2563eb; color: #fff; border: 1px solid #2563eb; border-radius: 8px; padding: 8px 16px; font-size: 15px; cursor: pointer; }
  button.secondary { background: #fff; color: #2563eb; }
  button:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body>
<main>
  <h1>ClearRead</h1>
  <p class="sub">Find text in a résumé that people can't see but AI screening tools can read.</p>

  <div id="drop">Drop a .pdf file here or click to choose one</div>
  <input id="picker" type="file" accept="application/pdf" hidden>

  <div id="card">
    <div class="head">
      <span class="name" id="filename"></span>
      <span class="badge" id="badge"></span>
    </div>
    <div id="message"></div>
    <ul id="findings"></ul>
    <div id="cleanbar">
      <div class="buttons">
        <button id="cleanbtn" type="button">Download clean copy</button>
        <button id="origbtn" class="secondary" type="button">Download original</button>
      </div>
      <div id="cleanmsg"></div>
    </div>
  </div>
</main>

<script>
const drop = document.getElementById("drop");
const picker = document.getElementById("picker");
const card = document.getElementById("card");

drop.addEventListener("click", () => picker.click());
picker.addEventListener("change", () => picker.files[0] && upload(picker.files[0]));
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => {
  e.preventDefault();
  drop.classList.remove("over");
  if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]);
});

const MAX_BYTES = 10 * 1024 * 1024;

// Quick checks before sending; the server repeats them and is the real protection.
async function clientError(file) {
  if (file.size === 0) return "The file is empty.";
  if (!/\.pdf$/i.test(file.name)) {
    const dot = file.name.lastIndexOf(".");
    const ext = dot >= 0 ? file.name.slice(dot + 1).toLowerCase() : "";
    return ext ? "Only .pdf files are supported. This is a ." + ext + " file." : "Only .pdf files are supported. This file has no extension.";
  }
  const head = await file.slice(0, 1024).text();
  if (!head.trimStart().startsWith("%PDF-")) {
    return "This .pdf file can't be opened. It may be damaged or renamed from another file type.";
  }
  if (file.size > MAX_BYTES) return "The file is larger than 10 MB.";
  return null;
}

let currentFile = null;
let hiddenLineCount = 0;

function baseName(file) {
  return file.name.replace(/\.pdf$/i, "");
}

function saveBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

async function upload(file) {
  currentFile = null;
  const problem = await clientError(file);
  if (problem) {
    showCard(file.name, null, problem, true);
    return;
  }
  showCard(file.name, null, "Scanning...");
  const body = new FormData();
  body.append("file", file);
  try {
    const response = await fetch("/api/scan", { method: "POST", body });
    const result = await response.json();
    if (!response.ok) {
      showCard(file.name, null, (typeof result.detail === "string" && result.detail) || "Scan failed", true);
      return;
    }
    currentFile = file;
    hiddenLineCount = result.findings.reduce((sum, f) => sum + f.lines, 0);
    render(result);
  } catch (err) {
    showCard(file.name, null, "Could not reach the server", true);
  }
}

document.getElementById("cleanbtn").addEventListener("click", cleanCopy);
document.getElementById("origbtn").addEventListener("click", () => {
  if (currentFile) saveBlob(currentFile, baseName(currentFile) + "_original.pdf");
});

async function cleanCopy() {
  if (!currentFile) return;
  const button = document.getElementById("cleanbtn");
  const msg = document.getElementById("cleanmsg");
  button.disabled = true;
  msg.className = "meta";
  msg.textContent = "Cleaning...";
  const body = new FormData();
  body.append("file", currentFile);
  try {
    const response = await fetch("/api/clean", { method: "POST", body });
    if (!response.ok) {
      const result = await response.json().catch(() => ({}));
      msg.className = "error";
      msg.textContent = (typeof result.detail === "string" && result.detail) || "Cleaning failed";
      return;
    }
    saveBlob(await response.blob(), baseName(currentFile) + "_clean.pdf");
    msg.className = "ok";
    msg.textContent = "Removed " + hiddenLineCount + " hidden " + (hiddenLineCount === 1 ? "line" : "lines") +
      ". Clean copy re-checked: no hidden text left, visible text unchanged.";
  } catch (err) {
    msg.className = "error";
    msg.textContent = "Could not reach the server";
  } finally {
    button.disabled = false;
  }
}

function showCard(name, badge, message, isError) {
  card.style.display = "block";
  document.getElementById("filename").textContent = name;
  const badgeEl = document.getElementById("badge");
  badgeEl.textContent = "";
  badgeEl.className = "badge";
  const msg = document.getElementById("message");
  msg.textContent = message || "";
  msg.className = isError ? "error" : "";
  document.getElementById("findings").innerHTML = "";
  document.getElementById("cleanbar").style.display = "none";
  document.getElementById("cleanmsg").textContent = "";
}

function render(result) {
  showCard(result.filename, null, "");
  const badge = document.getElementById("badge");
  const found = result.status === "hidden_text_found";
  badge.textContent = found ? "Hidden text found" : "Clean";
  badge.className = "badge " + (found ? "found" : "clean");
  document.getElementById("cleanbar").style.display = found ? "block" : "none";
  const list = document.getElementById("findings");
  for (const f of result.findings) {
    const li = document.createElement("li");
    const text = document.createElement("div");
    text.className = "text";
    text.textContent = f.text;
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = "Page " + f.page + " - " + f.lines + " hidden line" + (f.lines === 1 ? "" : "s") + " - " + f.reasons.join("; ");
    li.append(text, meta);
    if (f.note) {
      const note = document.createElement("div");
      note.className = "meta";
      note.textContent = f.note;
      li.appendChild(note);
    }
    list.appendChild(li);
  }
}
</script>
</body>
</html>
